<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YJGG · 요네 챔피언 분석</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

<!-- =====================================================================
  YJGG · 요네 올인원 사이트  (index.html 파일 하나로 동작합니다)

  ▸ GitHub에 이 파일을 index.html 이름으로 올리고
    Settings → Pages → Branch: main / (root) 선택하면 끝입니다.
  ▸ 시즌/패치 자동 갱신: 접속할 때마다 Riot 공식 Data Dragon의 "최신 버전"을
    읽어서 챔피언·스킬·룬·아이템·스킨 데이터를 자동으로 불러옵니다.
  ▸ 스킨 순위(인벤 별점)는 아래 INVEN_SKIN_RATINGS 에 직접 입력하세요.
====================================================================== -->

<style>
:root{
  --bg:#06080d; --panel:rgba(14,18,28,.82); --panel-solid:#0e121c; --raise:#161c2b;
  --line:#242c40; --line-soft:#1b2234;
  --text:#e9edf6; --mute:#8d98b0; --dim:#5d6780;
  --blue:#1f6bff; --blue-soft:rgba(31,107,255,.16);
  --cyan:#4fe3d6; --red:#ff3d6e; --gold:#ffc65c;
  --q:#4aa8ff; --w:#2fe6c2; --e:#ff9d33;
  --good:#3be08f; --bad:#ff5a7a;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
img{display:block}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ---------- background ---------- */
#bg{position:fixed;inset:0;z-index:-3;background:#05070b var(--splash,none) 50% 18%/cover no-repeat;filter:saturate(1.2) brightness(.62);transition:background-image .6s}
#bgfx{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(70% 55% at 8% 0%,rgba(79,227,214,.22),transparent 62%),
  radial-gradient(70% 60% at 100% 100%,rgba(255,61,110,.24),transparent 62%),
  linear-gradient(180deg,rgba(5,7,11,.45),rgba(5,7,11,.9) 62%,rgba(5,7,11,.97))}
#petals{position:fixed;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}

/* ---------- brand ---------- */
.brand{font-family:"Cinzel",serif;font-weight:800;letter-spacing:.32em;line-height:1;color:#fff;text-shadow:0 0 28px rgba(79,227,214,.45),0 0 2px rgba(255,61,110,.6)}
.brand-sub{color:var(--mute);font-size:.8rem;letter-spacing:.08em}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:100;background:#000;overflow:hidden;cursor:pointer}
#intro .panel{position:absolute;inset:0;will-change:transform,opacity}
#intro .art{position:absolute;inset:0;background:#05070b url("https://ddragon.leagueoflegends.com/cdn/img/champion/splash/Yone_0.jpg") 50% 20%/cover no-repeat;filter:saturate(1.2) brightness(.7);animation:artIn 1.1s ease-out both}
#intro .art::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 50%,rgba(0,0,0,.05),rgba(0,0,0,.75))}
#intro .ttl{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;animation:ttlIn 1s .2s ease-out both}
#intro .ttl .brand{font-size:clamp(3.4rem,13vw,9rem);padding-left:.32em}
#intro .ttl p{margin-top:1.1rem;color:#c9d2e6;letter-spacing:.5em;font-size:clamp(.7rem,1.6vw,1rem);padding-left:.5em}
#intro .pa{clip-path:polygon(0 0,70% 0,30% 100%,0 100%);animation:splitA .95s cubic-bezier(.6,0,.9,.5) 1.45s forwards}
#intro .pb{clip-path:polygon(70% 0,100% 0,100% 100%,30% 100%);animation:splitB .95s cubic-bezier(.6,0,.9,.5) 1.45s forwards}
#intro svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#intro .cut{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:100;stroke-dashoffset:100}
#intro .c1{stroke:#fff;stroke-width:3;animation:draw .2s cubic-bezier(.2,.7,.2,1) 1.1s forwards,fade .5s 1.7s forwards;filter:drop-shadow(0 0 8px #4fe3d6) drop-shadow(0 0 22px #4fe3d6)}
#intro .c2{stroke:var(--red);stroke-width:1.5;animation:draw .22s cubic-bezier(.2,.7,.2,1) 1.16s forwards,fade .5s 1.7s forwards;filter:drop-shadow(0 0 10px var(--red))}
#intro .flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash .35s 1.2s ease-out}
#intro .skip{position:absolute;right:20px;bottom:20px;font-size:.8rem;color:#c9d2e6;letter-spacing:.1em;padding:.5rem .9rem;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(0,0,0,.35);z-index:3}
@keyframes artIn{from{transform:scale(1.12);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes ttlIn{from{opacity:0;letter-spacing:.7em}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:0}}
@keyframes flash{0%{opacity:0}25%{opacity:.85}100%{opacity:0}}
@keyframes splitA{to{transform:translate(-16%,4%) rotate(-2deg);opacity:0}}
@keyframes splitB{to{transform:translate(16%,-4%) rotate(2deg);opacity:0}}

/* ---------- auth ---------- */
#auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.2rem 1rem}
#auth .brand{font-size:clamp(2.6rem,8vw,4.4rem);padding-left:.32em}
#auth .brand-sub{margin:.9rem 0 1.8rem}
.authcard{width:min(420px,100%);background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:1.4rem;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#0a0e17;border-radius:10px;padding:4px;margin-bottom:1.2rem}
.seg button{padding:.6rem;border-radius:8px;color:var(--mute);font-weight:600}
.seg button[aria-selected="true"]{background:var(--blue);color:#fff}
.field{margin-bottom:.9rem}
.field label{display:block;font-size:.82rem;color:var(--mute);margin-bottom:.35rem}
.field input[type=text],.field input[type=password]{width:100%;background:#0a0e17;border:1px solid var(--line);border-radius:10px;padding:.75rem .9rem;transition:border-color .15s}
.field input:focus{border-color:var(--blue);outline:none}
.hint{font-size:.76rem;color:var(--dim);margin-top:.3rem}
.check{display:flex;gap:.5rem;align-items:center;font-size:.85rem;color:var(--mute);margin:.2rem 0 1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:var(--blue);color:#fff;font-weight:700;border-radius:10px;padding:.8rem 1.1rem;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn.block{width:100%}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:600}
.msg{min-height:1.3rem;font-size:.85rem;margin-top:.8rem;color:var(--bad)}
.msg.ok{color:var(--good)}
.note{font-size:.74rem;color:var(--dim);margin-top:1rem;text-align:center}

/* ---------- app shell ---------- */
header.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,rgba(6,8,13,.94),rgba(6,8,13,.78));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
.top-in{max-width:1120px;margin:0 auto;padding:.8rem 1.1rem;display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap}
.top .logo{display:flex;flex-direction:column;gap:.35rem}
.top .logo .brand{font-size:1.9rem;letter-spacing:.3em}
.top .logo .brand-sub{font-size:.7rem}
nav.tabs{display:flex;gap:.4rem;margin-left:auto}
nav.tabs button{padding:.6rem 1.05rem;border-radius:10px;color:var(--mute);font-weight:600;border:1px solid transparent}
nav.tabs button:hover{color:var(--text)}
nav.tabs button[aria-selected="true"]{background:var(--blue);color:#fff}
.who{display:flex;align-items:center;gap:.7rem;font-size:.85rem;color:var(--mute)}
.who b{color:var(--text)}
.badge{font-size:.72rem;padding:.25rem .6rem;border-radius:999px;border:1px solid var(--line);color:var(--cyan);background:rgba(79,227,214,.08);white-space:nowrap}
main#view{max-width:1120px;margin:0 auto;padding:1.2rem 1.1rem 4rem}
.card{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line-soft);border-radius:var(--r)}
.pad{padding:1.2rem 1.3rem}
h2.sec{font-size:1rem;font-weight:700;margin-bottom:.8rem}
.loading{padding:4rem 1rem;text-align:center;color:var(--mute)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--cyan);border-radius:50%;margin:0 auto 1rem;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* lane tip panel */
.lane{display:flex;gap:1.3rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.lane h2{font-size:.95rem;font-weight:700;width:100%}
.pick{display:flex;align-items:center;gap:.8rem;min-width:230px;padding:.7rem .9rem;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);text-align:left;transition:border-color .15s,background .15s}
.pick:hover{border-color:var(--blue);background:var(--blue-soft)}
.pick .plus{width:42px;height:42px;border-radius:10px;background:#1b2234;display:grid;place-items:center;font-size:1.4rem;color:var(--mute)}
.pick img{width:42px;height:42px;border-radius:10px}
.pick small{display:block;font-size:.72rem;color:var(--mute)}
.pick strong{font-size:1rem}
.lane .desc{color:var(--mute);font-size:.9rem;flex:1;min-width:220px}
.roles{display:flex;gap:.3rem;margin-left:auto}
.roles button{padding:.45rem .8rem;border-radius:8px;border:1px solid var(--line);color:var(--mute);font-size:.82rem;font-weight:600}
.roles button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.clear{font-size:.8rem;color:var(--mute);text-decoration:underline;text-underline-offset:3px}

/* matchup */
.mu{margin-bottom:1rem;overflow:hidden}
.mu-head{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:1.2rem 1.3rem;border-bottom:1px solid var(--line-soft);background:linear-gradient(90deg,rgba(79,227,214,.08),transparent 40%,rgba(255,61,110,.08))}
.vs{display:flex;align-items:center;gap:.8rem}
.vs img{width:56px;height:56px;border-radius:12px;border:2px solid var(--line)}
.vs span{color:var(--dim);font-weight:800}
.mu-head h3{font-size:1.15rem}
.verdict{font-size:.8rem;font-weight:700;padding:.25rem .7rem;border-radius:999px}
.v-good{background:rgba(59,224,143,.14);color:var(--good)}
.v-even{background:rgba(255,198,92,.14);color:var(--gold)}
.v-bad{background:rgba(255,90,122,.14);color:var(--bad)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft)}
.metric{background:var(--panel-solid);padding:1rem 1.2rem}
.metric small{color:var(--mute);font-size:.78rem}
.metric .n{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.metric .n em{font-style:normal;font-size:1rem;color:var(--mute);font-weight:600;margin-left:2px}
.bar{height:5px;border-radius:5px;background:#1d2538;margin-top:.5rem;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--cyan)}
.bar i.r{background:var(--red)} .bar i.b{background:var(--blue)} .bar i.g{background:var(--gold)}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;padding:1.1rem 1.3rem;border-bottom:1px solid var(--line-soft)}
.phases div small{display:flex;justify-content:space-between;color:var(--mute);font-size:.78rem}
.phases div small b{color:var(--text)}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.tips section{padding:1.1rem 1.3rem;border-right:1px solid var(--line-soft)}
.tips section:last-child{border-right:0}
.tips h4{font-size:.9rem;margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem}
.tips h4::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--cyan)}
.tips section:nth-child(2) h4::before{background:var(--red)}
.tips section:nth-child(3) h4::before{background:var(--gold)}
.tips ul{list-style:none;display:grid;gap:.55rem}
.tips li{font-size:.88rem;color:#cdd5e6;padding-left:.9rem;position:relative}
.tips li::before{content:"";position:absolute;left:0;top:.62em;width:4px;height:4px;border-radius:50%;background:var(--dim)}
.basis{padding:.7rem 1.3rem;font-size:.74rem;color:var(--dim);border-top:1px solid var(--line-soft)}

/* build card */
.build{display:grid;grid-template-columns:190px 1fr;gap:1.4rem;padding:1.3rem}
.portrait{position:relative;width:190px;aspect-ratio:308/560;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait .rank{position:absolute;left:8px;top:0;background:var(--blue);color:#fff;font-weight:800;padding:.35rem .5rem .6rem;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);font-size:.85rem}
.bhead{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem;flex-wrap:wrap}
.bhead h2{font-size:1.5rem}
.bhead .sub{color:var(--mute);font-size:.88rem}
.bhead .btn{margin-left:auto;font-size:.85rem;padding:.55rem .9rem}
.blk{padding:1rem 0;border-top:1px solid var(--line-soft)}
.blk:first-of-type{border-top:0;padding-top:0}
.blk h5{font-size:.82rem;color:var(--mute);font-weight:600;margin-bottom:.6rem}
.icons{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.ic{display:flex;flex-direction:column;align-items:center;gap:.3rem;width:62px;text-align:center}
.ic img{width:42px;height:42px;border-radius:8px;border:1px solid #2a3350;background:#0a0e17}
.ic span{font-size:.68rem;line-height:1.2;color:var(--mute);word-break:keep-all}
.ic.sm img{width:34px;height:34px}
.arrow{color:var(--dim);font-size:.9rem;margin:0 .05rem;align-self:flex-start;margin-top:.7rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 1.5rem}
.prio{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.prio .ic{width:auto}
.prio .ic img{width:38px;height:38px;position:relative}
.keyR{position:relative}
.keyR::after{content:"R";position:absolute;right:-4px;bottom:-4px;background:var(--blue);color:#fff;font-size:.65rem;font-weight:800;width:16px;height:16px;border-radius:4px;display:grid;place-items:center}
.lvgrid{display:grid;grid-template-columns:repeat(18,1fr);gap:4px}
.lv{text-align:center}
.lv b{display:grid;place-items:center;height:30px;border-radius:5px;background:#1c2335;font-size:.8rem}
.lv b.Q{color:var(--q)} .lv b.W{color:var(--w)} .lv b.E{color:var(--e)}
.lv b.R{background:var(--blue);color:#fff}
.lv i{font-style:normal;font-size:.62rem;color:var(--dim)}
.lvtext{margin-top:.7rem;display:grid;gap:.3rem;font-size:.84rem;color:#cdd5e6}
.lvtext b{color:var(--text)}
.runes{display:flex;gap:1.6rem;flex-wrap:wrap}
.rtree h6{font-size:.76rem;color:var(--mute);font-weight:600;margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem}
.rtree h6 img{width:18px;height:18px}
.rrow{display:flex;gap:.45rem;align-items:flex-start}
.rune{width:64px;text-align:center}
.rune img{width:38px;height:38px;margin:0 auto;border-radius:50%;background:#0a0e17;padding:2px;border:1px solid #2a3350}
.rune.key img{width:48px;height:48px;border-color:var(--gold)}
.rune span{display:block;font-size:.66rem;color:var(--mute);line-height:1.2;margin-top:.25rem;word-break:keep-all}
.shards{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.7rem}
.chip{font-size:.78rem;padding:.3rem .65rem;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#cdd5e6}
.why{font-size:.84rem;color:var(--mute);margin-top:.6rem}
.sit{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.sit div{display:flex;gap:.7rem;align-items:center;padding:.55rem .7rem;border:1px solid var(--line-soft);border-radius:10px;background:rgba(255,255,255,.02)}
.sit img{width:36px;height:36px;border-radius:7px;flex:none}
.sit b{font-size:.82rem;display:block}
.sit small{font-size:.74rem;color:var(--mute);line-height:1.35;display:block}

/* modal */
#modal{position:fixed;inset:0;z-index:80;background:rgba(3,5,9,.78);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:1rem}
.mbox{width:min(880px,100%);max-height:88vh;background:var(--panel-solid);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.mtop{display:flex;gap:.8rem;align-items:center;padding:1rem 1.1rem;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.mtop h3{font-size:1rem}
.mtop input{flex:1;min-width:160px;background:#0a0e17;border:1px solid var(--line);border-radius:10px;padding:.6rem .9rem}
.mtop input:focus{outline:none;border-color:var(--blue)}
.x{width:34px;height:34px;border-radius:8px;font-size:1.2rem;color:var(--mute)}
.x:hover{background:rgba(255,255,255,.07);color:#fff}
.filters{display:flex;gap:.4rem;padding:.7rem 1.1rem;flex-wrap:wrap;border-bottom:1px solid var(--line-soft)}
.filters button{font-size:.8rem;padding:.35rem .75rem;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.filters button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{overflow:auto;padding:1rem 1.1rem 1.3rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:.7rem .5rem}
.grid button{display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:.35rem .1rem;border-radius:10px;border:1px solid transparent}
.grid button:hover{background:var(--blue-soft);border-color:var(--blue)}
.grid img{width:54px;height:54px;border-radius:10px}
.grid span{font-size:.7rem;color:var(--mute);text-align:center;line-height:1.2;word-break:keep-all}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:2rem}

/* info tab */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:0;overflow:hidden}
.hero .pic{min-height:300px;background-size:cover;background-position:50% 20%;position:relative}
.hero .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 40%,var(--panel-solid))}
.hero .txt{padding:1.5rem}
.hero h2{font-size:1.8rem}
.hero .t{color:var(--cyan);font-size:.9rem;margin-bottom:.8rem}
.hero p{color:#cdd5e6;font-size:.9rem;white-space:pre-line}
.tagrow{display:flex;gap:.4rem;margin-top:1rem;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
.stats div{padding:.7rem .9rem;border:1px solid var(--line-soft);border-radius:10px;background:rgba(255,255,255,.02)}
.stats small{display:block;color:var(--mute);font-size:.74rem}
.stats b{font-size:1.05rem}
.stats i{font-style:normal;font-size:.72rem;color:var(--dim);margin-left:.3rem}
.skl{display:grid;gap:.8rem}
.skl article{display:grid;grid-template-columns:52px 1fr;gap:.9rem;padding:.9rem;border:1px solid var(--line-soft);border-radius:12px;background:rgba(255,255,255,.02)}
.skl img{width:52px;height:52px;border-radius:10px;border:1px solid #2a3350}
.skl h4{font-size:.95rem;display:flex;gap:.5rem;align-items:center}
.skl h4 b{font-size:.72rem;padding:.1rem .45rem;border-radius:5px;background:#1c2335}
.skl h4 b.Q{color:var(--q)} .skl h4 b.W{color:var(--w)} .skl h4 b.E{color:var(--e)} .skl h4 b.R{background:var(--blue);color:#fff} .skl h4 b.P{color:var(--gold)}

<body>
<div id="bg"></div><div id="bgfx"></div><canvas id="petals" aria-hidden="true"></canvas>

<!-- ===== 인트로: 요네가 베는 연출 ===== -->

  <div class="panel pb"><div class="art"></div><div class="ttl"><div class="brand">YJGG</div><p>요네 · 챔피언 분석</p></div></div>
  <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">

<!-- ===== 로그인 / 회원가입 ===== -->
<section id="auth" hidden>

<!-- ===== 메인 앱 ===== -->

<!-- ===== 상대 챔피언 선택 모달 ===== -->

<script>
/* ==================================================================
   ★ 인벤 스킨 별점 입력란 ★
   형식:  스킨번호: 별점
   스킨 번호는 '스킨 순위' 탭에서 별점이 비어 있는 카드의 #번호 로 확인할 수 있어요.
   예)   1: 4.9,  2: 4.7,  3: 4.5
================================================================== */
const INVEN_SKIN_RATINGS = {
  // 1: 4.9,
};

/* ==================== 기본 유틸 ==================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain = h => { const d = document.createElement('div'); d.innerHTML = String(h ?? '').replace(/<br\s*\/?>/gi, '\n'); return d.textContent.trim(); };
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const DD = 'https://ddragon.leagueoflegends.com';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ==================== 회원 시스템 (브라우저 저장) ==================== */
const LS = { users: 'yjgg_users_v1', sess: 'yjgg_session_v1' };
const getUsers = () => { try { return JSON.parse(localStorage.getItem(LS.users) || '{}'); } catch { return {}; } };
const setUsers = u => localStorage.setItem(LS.users, JSON.stringify(u));
const toHex = buf => [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
function randSalt() {
  const a = new Uint8Array(16);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => a[i] = Math.random() * 256);
  return toHex(a);
}
async function hashPw(pw, salt) {
  if (window.crypto && crypto.subtle) {
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode(salt), iterations: 100000, hash: 'SHA-256' }, key, 256);
    return toHex(bits);
  }
  let h = 5381; const s = salt + pw;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return 'x' + h;
}
function getSession() {
  try { return JSON.parse(sessionStorage.getItem(LS.sess) || localStorage.getItem(LS.sess) || 'null'); } catch { return null; }
}
function setSession(u, keep) {
  const v = JSON.stringify({ id: u.id, name: u.name });
  sessionStorage.removeItem(LS.sess); localStorage.removeItem(LS.sess);
  (keep ? localStorage : sessionStorage).setItem(LS.sess, v);
}
function clearSession() { sessionStorage.removeItem(LS.sess); localStorage.removeItem(LS.sess); }

function authMsg(t, ok) { const m = $('#authMsg'); m.textContent = t || ''; m.className = 'msg' + (ok ? ' ok' : ''); }
function authTab(join) {
  $('#tabLogin').setAttribute('aria-selected', !join);
  $('#tabJoin').setAttribute('aria-selected', join);
  $('#loginForm').hidden = join; $('#joinForm').hidden = !join;
  authMsg('');
}
$('#tabLogin').onclick = () => authTab(false);
$('#tabJoin').onclick = () => authTab(true);

$('#joinForm').addEventListener('submit', async e => {
  e.preventDefault();
  const id = $('#jId').value.trim(), pw = $('#jPw').value, pw2 = $('#jPw2').value, name = $('#jName').value.trim();
  if (!/^[A-Za-z0-9]{4,20}$/.test(id)) return authMsg('아이디는 영문·숫자 4~20자로 입력해 주세요.');
  if (pw.length < 6) return authMsg('비밀번호는 6자 이상이어야 해요.');
  if (pw !== pw2) return authMsg('비밀번호 확인이 일치하지 않아요.');
  if (!name) return authMsg('이름을 입력해 주세요.');
  const users = getUsers(), key = id.toLowerCase();
  if (users[key]) return authMsg('이미 사용 중인 아이디예요.');
  const salt = randSalt();
  users[key] = { id, name, salt, hash: await hashPw(pw, salt), at: Date.now() };
  setUsers(users);
  $('#joinForm').reset(); $('#liId').value = id; $('#liPw').value = '';
  authTab(false); authMsg('가입이 완료됐어요. 로그인해 주세요.', true);
});
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const id = $('#liId').value.trim().toLowerCase(), pw = $('#liPw').value;
  const u = getUsers()[id];
  if (!u || (await hashPw(pw, u.salt)) !== u.hash) return authMsg('아이디 또는 비밀번호가 올바르지 않아요.');
  setSession(u, $('#liKeep').checked);
  enterApp(u);
});
$('#logout').onclick = () => { clearSession(); location.reload(); };

/* ==================== 데이터 (Riot Data Dragon · 항상 최신 패치) ==================== */
const S = { v: '', champs: {}, list: [], yone: null, items: {}, runes: {}, trees: {}, spells: {}, enemy: null, role: 'MID', tab: 'analysis', bgNum: 0, loaded: false };
const fj = async u => { const r = await fetch(u); if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); };

async function loadData() {
  const vers = await fj(`${DD}/api/versions.json`);
  const v = vers[0]; S.v = v;
  const base = `${DD}/cdn/${v}/data/ko_KR`;
  const [ch, yo, it, ru, sp] = await Promise.all([
    fj(`${base}/champion.json`), fj(`${base}/champion/Yone.json`), fj(`${base}/item.json`),
    fj(`${base}/runesReforged.json`), fj(`${base}/summoner.json`)
  ]);
  S.champs = ch.data;
  S.list = Object.values(ch.data).sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  S.yone = yo.data.Yone;
  S.items = it.data;
  S.spells = sp.data;
  S.trees = {};
  ru.forEach(t => { S.trees[t.id] = t; t.slots.forEach(s => s.runes.forEach(r => S.runes[r.id] = r)); });
  S.loaded = true;
  const [major, minor] = v.split('.');
  $('#patch').textContent = `시즌 ${major} · 패치 ${major}.${minor}`;
  const saved = parseInt(localStorage.getItem('yjgg_bg') || '0', 10);
  const nums = S.yone.skins.map(s => s.num);
  setBg(nums.includes(saved) ? saved : 0, true);
}
const splash = n => `${DD}/cdn/img/champion/splash/Yone_${n}.jpg`;
const loading = n => `${DD}/cdn/img/champion/loading/Yone_${n}.jpg`;
const champImg = c => `${DD}/cdn/${S.v}/img/champion/${c.image.full}`;
const itemImg = id => `${DD}/cdn/${S.v}/img/item/${id}.png`;
function setBg(n, silent) {
  S.bgNum = n;
  document.documentElement.style.setProperty('--splash', `url("${splash(n)}")`);
  $('#bg').style.setProperty('--splash', `url("${splash(n)}")`);
  localStorage.setItem('yjgg_bg', n);
  if (!silent && S.tab === 'analysis') render();
}

/* ==================== 매치업 분석 엔진 ==================== */
/* [Yone 기준 유불리 보정(+유리 / -불리), 이기는 법, 조심할 점]  — 분석 추정치 */
const CUR = {
  Yasuo:[0,'야스오의 W(바람의 장막)는 Q3 투사체를 막습니다. 상대 W 쿨타임을 확인하고 Q3를 쓰세요.','E로 미니언을 타고 붙는 평타 교환에 응하면 체력 손해를 봅니다. W 실드를 아끼지 마세요.'],
  Irelia:[-2,'이렐리아의 Q 리셋이 끊기는(주변 미니언이 적은) 순간에 Q·E로 먼저 교환하세요.','2~5레벨 이렐리아는 매우 강합니다. 미니언을 밟고 오는 교환을 정면으로 받지 마세요.'],
  Fiora:[-1.5,'피오라의 W(받아치기)가 빠진 직후가 교환 타이밍입니다.','W가 준비된 상태에서 Q3나 R로 선공하면 효과가 무효화됩니다.'],
  Riven:[-1.5,'리븐의 Q 3타 사이 쿨타임을 노려 E로 빠지며 평타를 섞어 주세요.','스킬 콤보 한 번에 체력이 크게 깎입니다. W 실드를 콤보 시작에 맞춰 쓰세요.'],
  Renekton:[-2.5,'레넥톤의 분노 게이지가 낮고 스킬이 빠진 직후에 역공하세요.','2~5레벨 레넥톤의 스턴 콤보는 위협적입니다. 6레벨까지 무리한 교환을 피하세요.'],
  Malphite:[-1.5,'말파이트는 초반 교환이 약하니 Q 스택으로 견제하세요.','E/W 위치를 조심하고, R 사거리 안에서 오래 머물지 마세요.'],
  Akali:[-1,'아칼리의 에너지가 낮을 때 접근해 교환하세요.','연막 안에서는 시야가 가려지니 연막 밖에서 교전하세요.'],
  Zed:[-.5,'상대 Q를 맞기 전에 E로 빼고, 분신(W) 위치를 확인한 뒤 평타를 섞어 교환하세요.','6레벨 이후 R 콤보에 순식간에 녹습니다. R이 켜진 구간에는 W 실드를 먼저 쓰지 마세요.'],
  Ahri:[.5,'아리의 매혹(E) 사거리 밖에서 Q 스택을 쌓고, 스킬이 빠지면 곧바로 붙으세요.','매혹에 맞는 순간 콤보가 이어집니다. 일직선 상에 미니언을 끼고 서세요.'],
  Lux:[-1,'럭스의 바인드(Q)가 빠지면 E 이후 바로 붙어 킬각을 보세요.','바인드를 맞으면 치명적입니다. 미니언 뒤에 서서 일직선을 피하세요.'],
  Viktor:[-1.5,'빅토르의 스킬이 빠진 직후 붙고, 6레벨 전후에 한 번 크게 교환하세요.','지속 견제와 장판 때문에 체력이 서서히 깎입니다. 장판 안에서 싸우지 마세요.'],
  Orianna:[-1.5,'오리아나의 공(Q) 위치를 확인하고 공에서 먼 쪽으로 붙으세요.','R 범위와 공 위치를 항상 확인하세요.'],
  Syndra:[-1,'스킬이 빠진 직후 E→평타로 붙어 교환하세요.','구체와 스턴(E) 조합을 조심하세요. 높은 체력 구간에서는 후퇴하세요.'],
  Cassiopeia:[-2.5,'카시오페아의 스킬이 모두 빠졌을 때만 접근해 교환하세요. 마나가 부족한 초반이 기회입니다.','독과 이동 방해로 접근이 어렵습니다. 억지로 붙기보다 CS와 체력 관리를 우선하세요.'],
  Vladimir:[-2,'블라디미르의 생존 스킬이 빠진 순간에 집중해서 교환하세요.','후반에는 체력이 폭발적으로 늘어납니다. 초반에 압박을 이어가세요.'],
  Katarina:[.5,'W 실드·E를 아끼고 단검이 흩어진 후에 교환하세요.','R 사용 중에는 거리를 벌리거나 W 실드를 쓰세요.'],
  Talon:[-.5,'탈론의 스킬 사이 쿨타임을 노려 맞교환하세요.','로밍과 폭딜에 주의하세요. 라인 푸시를 허용하지 마세요.'],
  Sylas:[-1,'시라스의 쇠사슬이 빠진 후를 노려 붙으세요.','R로 요네의 R을 훔쳐갈 수 있습니다. 킬각 외에는 사용하지 마세요.'],
  Galio:[-1,'갈리오는 이동기가 짧아 E→평타 콤보로 집요하게 압박하세요.','CC 연계가 아프니 W 쿨타임 동안 접근을 자제하세요.'],
  Kassadin:[.5,'카사딘은 초반이 약합니다. 1~5레벨에 적극 압박하세요.','레벨 11 이후 급격히 강해집니다. 그 전에 라인 우위를 굳히세요.'],

const SCALERS = new Set(['Kassadin','Nasus','Vayne','Kayle','Veigar','Ryze','Cassiopeia','Vladimir','Gwen','Jax','Sion','Kayn','Senna','Zeri','Mordekaiser','Ornn']);
const BULLIES = new Set(['Renekton','Pantheon','Irelia','Riven','Darius','Jayce','Quinn','Lucian','Olaf','Tryndamere','Lee Sin','Kled','Sett','Aatrox','Fiora','Camille','Akali','Yasuo','Teemo']);
const HARDCC = new Set(['Cassiopeia','Malphite','Lissandra','Galio','Renekton','Sett','Mordekaiser','Syndra','Morgana','Leona','Nautilus','Skarner','Rell','Maokai','Ornn','Annie','Lux','Ahri','Neeko','Nami','Sejuani','Vi','Zyra','Blitzcrank','Thresh']);
const HEALERS = new Set(['Aatrox','Vladimir','Warwick','Swain','DrMundo','Soraka','Sylas','Fiora','Briar','Olaf','Irelia','Yuumi','Sona','Nami','Kayn','Illaoi','Nidalee','Zac']);

function analyze(e, role) {
  const t = e.tags, rng = e.stats.attackrange, inf = e.info, id = e.id;
  const f = {
    ranged: rng >= 400, long: rng >= 550, tank: t.includes('Tank') || inf.defense >= 8,
    assassin: t.includes('Assassin'), marksman: t.includes('Marksman'),
    mage: t.includes('Mage'), fighter: t.includes('Fighter'), support: t.includes('Support'),
    ap: inf.magic >= 7 && inf.magic > inf.attack, ad: inf.attack >= 7 && inf.attack >= inf.magic,
    cc: HARDCC.has(id), heal: HEALERS.has(id),
    squishy: e.stats.hp <= 620 && !t.includes('Tank'),
    scaler: SCALERS.has(id), bully: BULLIES.has(id)
  };
  f.poke = f.long && (f.mage || f.marksman);
  const cur = CUR[id];
  let d = 0;
  if (cur) d = cur[0];
  else {
    if (f.ranged) d -= 1.1; if (f.long) d -= .5;
    if (f.marksman) d -= .9;
    if (f.mage && !f.fighter) d -= .5;
    if (f.tank) d -= .7;
    if (f.assassin) d -= .2;
    if (f.fighter && !f.ranged) d -= .3;
    if (f.support && !f.tank) d += .3;
    if (f.scaler) d += .5;
    if (f.bully) d -= .5;
    if (inf.difficulty >= 8) d += .3;
    if (f.squishy && !f.ranged) d += .6;
  }
  d = clamp(d, -3.5, 2.5);
  const win = +clamp(50 + d, 42, 57).toFixed(1);
  let kill = 15 + d * 3.5 + (f.squishy ? 4 : 0) - (f.tank ? 5 : 0) - (f.ranged ? 3 : 0) - (f.bully ? 3 : 0) + (f.scaler ? 3 : 0);
  let death = 15 - d * 3.5 + (f.bully ? 4 : 0) + (f.assassin ? 2 : 0) - (f.scaler ? 3 : 0) + (f.cc ? 2 : 0);
  kill = Math.round(clamp(kill, 5, 38)); death = Math.round(clamp(death, 5, 38));
  const phases = {
    early: Math.round(clamp(50 + d * 6 + (f.bully ? -10 : 0) + (f.scaler ? 11 : 0) + (f.ranged ? -4 : 0), 15, 85)),
    mid: Math.round(clamp(50 + d * 4 + 2, 15, 85)),
    late: Math.round(clamp(50 + d * 3 + 4 + (f.scaler ? -9 : 0) + (f.bully ? 5 : 0) + (f.marksman ? -4 : 0), 15, 85))
  };
  const diffText = d <= -2 ? '매우 어려움' : d <= -.8 ? '다소 어려움' : d < .8 ? '보통' : '쉬움';
  const verdict = d >= .8 ? ['v-good', '요네 유리'] : d > -.8 ? ['v-even', '팽팽한 라인전'] : d > -2 ? ['v-bad', '요네 다소 불리'] : ['v-bad', '요네 불리'];

  /* ----- 팁 ----- */
  const win_ = [], danger = [], over = [];
  if (cur) { win_.push(cur[1]); danger.push(cur[2]); }
  if (f.ranged) win_.push('Q 스택은 미니언으로 쌓고, 상대 스킬이 빠진 직후 Q3·E로 붙어서 교환하세요.');
  else win_.push('근접 챔피언이라 E로 파고들었다 되돌아오는 교환이 가능합니다. 상대가 붙을 때 W 실드로 받아치세요.');
  if (f.squishy) win_.push('체력이 낮은 편이라 E→평타→Q 콤보로 킬각이 잘 나옵니다. 6레벨 R이 있으면 확정 킬을 노려 보세요.');
  if (f.tank) win_.push('솔킬이 어려운 상대입니다. CS와 체력 관리로 레벨·아이템 우위를 만든 뒤 방어 관통 아이템으로 승부하세요.');
  if (f.scaler) win_.push('성장형 챔피언입니다. 2~5레벨에 적극적으로 압박해 라인 주도권을 가져오세요.');
  if (f.bully) win_.push('초반이 강한 챔피언입니다. 6레벨 전까지는 CS와 체력 유지에 집중하세요.');
  if (f.assassin) danger.push('폭딜 암살자입니다. 상대 스킬이 준비된 상태에서는 W 실드를 일찍 쓰지 말고 필요한 순간에 쓰세요.');
  if (f.cc) danger.push('CC 연계에 걸리면 한 번에 죽을 수 있습니다. 핵심 CC 쿨타임 전에는 E 진입을 자제하고, 정화나 수은 장화를 고려하세요.');
  if (f.poke) danger.push('원거리 견제로 체력이 서서히 깎입니다. 미니언 뒤 포지셔닝과 W 실드로 대응하세요.');
  if (f.heal) danger.push('회복 효과가 강한 상대입니다. 상처 입히기(치유 감소) 아이템과 점화로 대응하세요.');
  if (f.tank) danger.push('높은 체력과 방어력 앞에서 긴 교환은 손해입니다. R은 확실한 킬각이 아닐 땐 아끼세요.');
  if (!danger.length) danger.push('요네의 E 후 되돌아오는 위치를 상대가 노리고 있을 수 있습니다. 귀환 지점을 미리 정해 두세요.');
  over.push('라인을 깊게 밀지 말고 웨이브를 정리하며 체력·마나를 유지하세요. 도란의 방패 + 포션 시작도 방법입니다.');
  over.push('정글러에게 3~4레벨 갱킹을 요청하고, 상대 정글 위치에 와드를 두세요.');
  if (role === 'TOP') over.push('불리하면 텔레포트로 라인을 비우고 합류 타이밍을 노리세요. 사이드 푸시와 팀 파이트를 오가세요.');
  else over.push('불리하면 웨이브 정리 후 로밍·정글 합류로 이득을 만드세요.');
  if (f.ranged) over.push('Q 스택을 쌓은 뒤 W 실드로 견제를 소모시키며 6레벨 R 타이밍을 기다리세요.');
  over.push('6레벨 R이 생기면 교환 구도가 달라집니다. 최소한 6레벨까지 CS와 체력 유지에 집중하세요.');
  over.push('요네는 후반 캐리 챔피언입니다. 팀파이트에서는 R로 가운데를 뚫고 E로 딜 후 복귀하세요.');
  const good = d >= .8;
  const overTitle = good ? '유리해도 지킬 점' : d > -.8 ? '균형을 깨는 방법' : '불리할 때 극복법';
  const overList = good ? ['우위가 생겼을 때 푸시를 키우고 로밍으로 이득을 굴리세요.', '상대가 정글 갱킹을 부르면 와드·R 쿨타임을 확인하세요.', '킬각이 나지 않는 구간에서 억지 교환은 하지 않는 것이 좋습니다.'] : over.slice(0, d > -.8 ? 4 : 6);

  /* ----- 스펠 ----- */
  let sp = ['SummonerFlash', 'SummonerDot'], spWhy = '점멸 + 점화: E 이후 킬각을 확정하는 가장 무난한 조합입니다.';
  if (role === 'TOP' && f.ranged) { sp = ['SummonerFlash', 'SummonerTeleport']; spWhy = '원거리 상대 탑이라면 라인 푸시에 밀려도 텔레포트로 합류하며 이득을 볼 수 있습니다.'; }
  else if (role === 'TOP' && d <= -1.5) { sp = ['SummonerFlash', 'SummonerTeleport']; spWhy = '라인전이 불리한 탑이라면 텔레포트로 라인 손해를 줄이고 팀파이트에 합류하는 구도가 좋습니다.'; }
  if (f.heal && !sp.includes('SummonerDot')) spWhy += ' (회복형 상대라면 점화로 교체 고려)';
  const spAlt = [];
  if (f.cc) spAlt.push(['SummonerBoost', '강한 CC 연계가 걱정된다면 점멸 + 정화']);
  if (f.assassin) spAlt.push(['SummonerBarrier', '폭딜 암살자 상대로 체력이 불안하면 방어막']);
  if (f.heal) spAlt.push(['SummonerDot', '회복 억제용 점화']);

  /* ----- 스킬 순서 ----- */
  const poke = f.ranged && (f.poke || f.mage || f.marksman);
  const order = poke
    ? 'Q W E W Q R Q W Q W R W E E E R E E'.split(' ')
    : 'Q W E Q Q R Q E Q E R E E W W R W W'.split(' ');
  const skillText = poke
    ? ['<b>1레벨 Q</b> → <b>2레벨 W</b> → <b>3레벨 E</b>: 원거리 견제 상대는 W 실드를 일찍 올려 체력 손해를 줄입니다.', '<b>4레벨 W</b>를 한 번 더 올려 쉴드 피해량을 키웁니다.', '<b>6/11/16레벨 R</b>은 가능한 한 빨리 올리고, Q는 7·9레벨에 연속으로 올립니다.']
    : ['<b>1레벨 Q</b> → <b>2레벨 W</b> → <b>3레벨 E</b>: 시작 후 Q·Q3 스택으로 압박합니다.', '<b>4·5레벨 Q</b>를 연속으로 올려 Q 쿨다운과 대미지를 빠르게 확보합니다.', '<b>6/11/16레벨 R</b>은 가능한 한 빨리 올리고, Q 만렙 후 E → W 순으로 올립니다.'];

  /* ----- 룬 ----- */
  const sec = f.ranged || f.poke ? [8444, 8451] : [8473, 8242];
  const fourth = f.tank ? 8017 : f.squishy ? 8014 : 8299;
  const runes = {
    pri: { tree: 8000, list: [8010, 9111, 9104, fourth] },
    sec: { tree: 8400, list: sec },
    shards: f.cc ? ['적응형 능력치', '공격 속도', '체력 (강인함 고려)'] : f.poke ? ['적응형 능력치', '적응형 능력치', '체력'] : ['적응형 능력치', '공격 속도', '체력'],
    why: `정복자로 지속 교전 시 대미지·회복을 챙기고, ${f.tank ? '탱커에게 강한 최후의 일격' : f.squishy ? '체력이 낮은 상대를 마무리하는 대미지 증가' : '피해를 받을수록 강해지는 마지막 저항'} 계열로 마무리합니다. 보조는 ${f.ranged || f.poke ? '견제 상대에 대비한 회복' : '근접전 생존을 위한 방어 룬'}으로 구성했습니다.`
  };

  /* ----- 아이템 ----- */
  const valid = id => S.items[id] && S.items[id].gold && S.items[id].gold.purchasable !== false;
  const pick = arr => arr.find(valid);
  const start = [pick(d <= -1.5 || f.poke ? [1054, 1055] : [1055, 1054]), 2003].filter(Boolean);
  const boots = [pick(f.cc || f.ap ? [3111, 3006] : (f.ad && (f.fighter || f.marksman) ? [3047, 3006] : [3006, 3111]))].filter(Boolean);
  const coreIds = [
    pick(f.tank ? [6672, 6673] : [6673, 6672]), pick([3031]),
    pick(f.ap ? [3156, 6333] : [6333, 3156]),
    pick(f.heal ? [3033] : f.tank ? [3036, 3071] : [3072, 3508]),
    pick(f.ap ? [3091, 3026] : [3026, 3053]), pick([3026, 3053])
  ].filter(Boolean);
  const core = [...new Set(coreIds)];
  const sit = [];
  const add = (ids, why) => { const p = pick(ids); if (p && !core.includes(p) && !sit.find(s => s.id === p)) sit.push({ id: p, why }); };
  if (f.heal) add([3033, 3123], '상대 회복이 강해 치유 감소가 필요할 때');
  if (f.tank) add([3036, 3071], '체력·방어력이 높은 상대에게 방어 관통이 필요할 때');
  if (f.ap || f.cc) add([3156, 3091, 3140], '마법 피해와 CC가 위협적일 때 생존·저항 확보');
  if (f.assassin || f.ad) add([6333, 3026, 3053], '암살자 폭딜을 견디고 역전해야 할 때');
  if (f.poke) add([6673, 3053], '지속 견제를 견디며 교전 시 생존하고 싶을 때');
  add([3074, 3077], '웨이브 정리가 느릴 때 보조 선택');
  add([3814, 6694], '상대 방어력을 더 깎아야 할 때');
  return { f, d, win, kill, death, phases, diffText, verdict, tips: { win: win_.slice(0, 5), danger: danger.slice(0, 5), over: overList, overTitle }, sp, spWhy, spAlt, order, skillText, runes, items: { start, boots, core, sit: sit.slice(0, 4) } };
}

/* ==================== 렌더링 ==================== */
const spImg = id => S.spells[id] ? `${DD}/cdn/${S.v}/img/spell/${S.spells[id].image.full}` : '';
const spName = id => S.spells[id] ? S.spells[id].name : id;
const itemChip = (id, i) => {
  const it = S.items[id]; if (!it) return '';
  return `<div class="ic" title="${esc(it.name)} · ${it.gold.total}골드"><img src="${itemImg(id)}" alt="${esc(it.name)}" loading="lazy"><span>${esc(it.name)}</span></div>${i === undefined ? '' : ''}`;
};
const chain = ids => ids.map((id, i) => (i ? '<span class="arrow">›</span>' : '') + itemChip(id)).join('');
function runeBlock(g) {
  const tr = S.trees[g.tree]; if (!tr) return '';
  const rs = g.list.map((id, i) => {
    const r = S.runes[id]; if (!r) return '';
    return `<div class="rune ${g.key && i === 0 ? 'key' : ''}" title="${esc(r.name)}"><img src="${DD}/cdn/img/${r.icon}" alt="${esc(r.name)}" loading="lazy"><span>${esc(r.name)}</span></div>`;
  }).join('');
  return `<div class="rtree"><h6><img src="${DD}/cdn/img/${tr.icon}" alt="">${esc(tr.name)}</h6><div class="rrow">${rs}</div></div>`;
}
function skillRow(order) {
  return `<div class="lvgrid">${order.map((k, i) => `<div class="lv"><b class="${k}">${k}</b><i>${i + 1}</i></div>`).join('')}</div>`;
}

function buildCard(a) {
  const y = S.yone, sp = y.spells;
  const sIcon = (i, k) => `<div class="ic ${k === 'R' ? 'keyR' : ''}" style="width:auto"><img src="${DD}/cdn/${S.v}/img/spell/${sp[i].image.full}" alt="${esc(sp[i].name)}" title="${esc(sp[i].name)}"></div>`;
  const items = a.items;
  const ordered = `<div class="prio"><div class="ic" style="width:auto"><img src="${DD}/cdn/${S.v}/img/spell/${sp[3].image.full}" alt="R" title="${esc(sp[3].name)}" class="keyR"></div>${sIcon(0, 'Q')}<span class="arrow" style="margin-top:0">›</span>${sIcon(2, 'E')}<span class="arrow" style="margin-top:0">›</span>${sIcon(1, 'W')}</div>`;
  const spells = a.sp.map(id => `<div class="ic"><img src="${spImg(id)}" alt="${esc(spName(id))}" title="${esc(spName(id))}"><span>${esc(spName(id))}</span></div>`).join('');
  const alts = a.spAlt.map(([id, why]) => `<span class="chip" title="${esc(why)}">대안 · ${esc(spName(id))}</span>`).join('');
  return `<article class="card build">
    <div class="portrait"><img src="${loading(S.bgNum)}" alt="요네" onerror="this.src='${loading(0)}'"><span class="rank">1</span></div>
    <div>
      <div class="bhead"><h2>요네</h2><span class="sub">${esc(y.title)} · ${S.role === 'TOP' ? '탑' : '미드'} 기준</span>
        <a class="btn ghost" href="https://www.youtube.com/results?search_query=${encodeURIComponent('요네 콤보 영상')}" target="_blank" rel="noopener">⚔ 콤보 영상</a></div>
      <div class="two">
        <div class="blk"><h5>스펠</h5><div class="icons">${spells}</div><p class="why">${esc(a.spWhy)}</p><div class="shards" style="margin-top:.5rem">${alts}</div></div>
        <div class="blk"><h5>스킬 우선순위</h5>${ordered}</div>
      </div>
      <div class="blk"><h5>레벨별 스킬 순서 (1 → 18)</h5>${skillRow(a.order)}<div class="lvtext">${a.skillText.map(t => `<div>${t}</div>`).join('')}</div></div>
      <div class="blk"><h5>룬</h5>
        <div class="runes">${runeBlock({ ...a.runes.pri, key: true })}${runeBlock(a.runes.sec)}</div>
        <div class="shards">${a.runes.shards.map(s => `<span class="chip">조각 · ${esc(s)}</span>`).join('')}</div>
        <p class="why">${esc(a.runes.why)}</p></div>
      <div class="two">
        <div class="blk"><h5>시작 아이템</h5><div class="icons">${items.start.map(id => itemChip(id)).join('')}</div></div>
        <div class="blk"><h5>신발</h5><div class="icons">${items.boots.map(id => itemChip(id)).join('')}</div></div>
      </div>
      <div class="blk"><h5>코어 아이템 (구매 순서)</h5><div class="icons">${chain(items.core)}</div></div>
      ${items.sit.length ? `<div class="blk"><h5>상황별 아이템</h5><div class="sit">${items.sit.map(s => `<div><img src="${itemImg(s.id)}" alt=""><span><b>${esc(S.items[s.id].name)}</b><small>${esc(s.why)}</small></span></div>`).join('')}</div></div>` : ''}
    </div></article>`;
}

function matchupCard(e, a) {
  const bar = (n, c) => `<div class="bar"><i class="${c || ''}" style="width:${n}%"></i></div>`;
  const ph = (n, v) => `<div><small>${n}<b>${v}</b></small>${bar(v, v >= 50 ? 'g' : 'r')}</div>`;
  const li = arr => arr.map(t => `<li>${esc(t)}</li>`).join('');
  return `<section class="card mu">
    <div class="mu-head">
      <div class="vs"><img src="${champImg(S.champs.Yone)}" alt="요네"><span>VS</span><img src="${champImg(e)}" alt="${esc(e.name)}"></div>
      <div><h3>요네 vs ${esc(e.name)}</h3><div style="color:var(--mute);font-size:.82rem">${esc(e.title)} · ${e.tags.map(esc).join('/')}</div></div>
      <span class="verdict ${a.verdict[0]}">${a.verdict[1]}</span>
    </div>
    <div class="metrics">
      <div class="metric"><small>예상 승률</small><div class="n">${a.win}<em>%</em></div>${bar(clamp((a.win - 40) * 5, 5, 100), 'b')}</div>
      <div class="metric"><small>라인 킬 확률(요네 솔킬)</small><div class="n">${a.kill}<em>%</em></div>${bar(a.kill * 2.2)}</div>
      <div class="metric"><small>라인 데스 확률(솔킬 당함)</small><div class="n">${a.death}<em>%</em></div>${bar(a.death * 2.2, 'r')}</div>
      <div class="metric"><small>라인전 난이도</small><div class="n" style="font-size:1.3rem;padding-top:.35rem">${a.diffText}</div></div>
    </div>
    <div class="phases">${ph('초반 (1~5레벨)', a.phases.early)}${ph('중반 (6~10레벨)', a.phases.mid)}${ph('후반 (11레벨~)', a.phases.late)}</div>
    <div class="tips">
      <section><h4>이기는 방법</h4><ul>${li(a.tips.win)}</ul></section>
      <section><h4>조심할 점</h4><ul>${li(a.tips.danger)}</ul></section>
      <section><h4>${esc(a.tips.overTitle)}</h4><ul>${li(a.tips.over)}</ul></section>
    </div>
    <div class="basis">※ 승률·킬 확률은 실제 통계가 아닌 분석 추정치입니다. 챔피언 클래스·사거리·능력치(Riot Data Dragon ${esc(S.v)})와 요네 스킬셋 상성을 기준으로 계산합니다.</div>
  </section>`;
}

function viewAnalysis() {
  const e = S.enemy;
  const a = analyze(e || S.champs.Yone, S.role);
  const base = e ? a : analyze({ ...S.champs.Yone, id: '_', tags: ['Fighter'], stats: { ...S.champs.Yone.stats, attackrange: 175, hp: 650 }, info: { attack: 8, defense: 4, magic: 4, difficulty: 8 } }, S.role);
  const pickBtn = e
    ? `<button class="pick" id="openPick" type="button"><img src="${champImg(e)}" alt=""><span><small>상대 챔피언</small><strong>${esc(e.name)}</strong></span></button>`
    : `<button class="pick" id="openPick" type="button"><span class="plus">+</span><span><small>상대 챔피언</small><strong>선택</strong></span></button>`;
  return `<section class="card pad lane"><h2>라인 팁</h2>${pickBtn}
    <div class="desc">${e ? `${esc(e.name)} 상대 매치업 분석이 아래에 표시됩니다. <button class="clear" id="clearPick" type="button">선택 해제</button>` : '상대 챔피언을 고르면 매치업 팁이 표시됩니다.'}</div>
    <div class="roles" role="group" aria-label="라인"><button type="button" data-role="TOP" aria-pressed="${S.role === 'TOP'}">탑</button><button type="button" data-role="MID" aria-pressed="${S.role === 'MID'}">미드</button></div></section>
    ${e ? matchupCard(e, a) : ''}
    ${buildCard(base)}`;
}

function viewInfo() {
  const y = S.yone, st = y.stats;
  const val = (k, per) => per ? +(st[k] + st[per] * 17).toFixed(0) : st[k];
  const stat = (n, a, b) => `<div><small>${n}</small><b>${a}</b>${b ? `<i>→ 18레벨 ${b}</i>` : ''}</div>`;
  const keys = ['Q', 'W', 'E', 'R'];
  const skills = [`<article><img src="${DD}/cdn/${S.v}/img/passive/${y.passive.image.full}" alt=""><div><h4><b class="P">패시브</b>${esc(y.passive.name)}</h4><p>${esc(plain(y.passive.description))}</p></div></article>`]
    .concat(y.spells.map((s, i) => `<article><img src="${DD}/cdn/${S.v}/img/spell/${s.image.full}" alt=""><div><h4><b class="${keys[i]}">${keys[i]}</b>${esc(s.name)}</h4><p>${esc(plain(s.description))}</p><small>재사용 대기시간 ${esc(s.cooldownBurn)}초 · 소모 ${esc(s.costBurn)}</small></div></article>`));
  return `<section class="card hero"><div class="pic" style="background-image:url('${splash(S.bgNum)}')"></div><div class="txt">
      <h2>${esc(y.name)}</h2><div class="t">${esc(y.title)}</div><p>${esc(plain(y.lore))}</p>
      <div class="tagrow">${y.tags.map(t => `<span class="chip">${esc(t)}</span>`).join('')}<span class="chip">자원 ${esc(y.partype || '없음')}</span></div></div></section>
    <section class="card pad" style="margin-top:1rem"><h2 class="sec">기본 능력치 (1레벨)</h2><div class="stats">
      ${stat('체력', st.hp, val('hp', 'hpperlevel'))}${stat('공격력', st.attackdamage, val('attackdamage', 'attackdamageperlevel'))}
      ${stat('방어력', st.armor, val('armor', 'armorperlevel'))}${stat('마법 저항력', st.spellblock, val('spellblock', 'spellblockperlevel'))}
      ${stat('이동 속도', st.movespeed)}${stat('사거리', st.attackrange)}${stat('체력 재생', st.hpregen)}${stat('기본 공격 속도', st.attackspeed)}</div></section>
    <section class="card pad" style="margin-top:1rem"><h2 class="sec">스킬 설명</h2><div class="skl">${skills.join('')}</div></section>
    <section class="card pad" style="margin-top:1rem"><div class="tipcols">
      <div><h2 class="sec">요네 플레이 팁</h2><ul>${(y.allytips || []).map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
      <div><h2 class="sec">요네를 상대하는 팁</h2><ul>${(y.enemytips || []).map(t => `<li>${esc(t)}</li>`).join('')}</ul></div></div></section>`;
}

function viewSkins() {
  const skins = S.yone.skins.map(s => ({ ...s, name: s.num === 0 ? '기본 요네' : s.name, rating: INVEN_SKIN_RATINGS[s.num] }));
  const rated = skins.filter(s => typeof s.rating === 'number').sort((a, b) => b.rating - a.rating || b.num - a.num);
  const unrated = skins.filter(s => typeof s.rating !== 'number').sort((a, b) => b.num - a.num);
  const all = [...rated, ...unrated];
  const stars = r => `<div class="stars"><span class="st">★★★★★<i style="width:${r * 20}%">★★★★★</i></span><b>${r.toFixed(1)}</b></div>`;
  const cards = all.map((s, i) => {
    const has = typeof s.rating === 'number';
    return `<article class="card skin"><div class="im"><img src="${splash(s.num)}" alt="${esc(s.name)}" loading="lazy">${has ? `<span class="no ${i < 3 ? 'top' : ''}">${i + 1}</span>` : ''}</div>
      <div class="bd"><h4>${esc(s.name)}</h4>${has ? stars(s.rating) : '<div class="stars"><small>인벤 별점 미입력</small></div>'}
      <div class="acts"><span>스킨 #${s.num}</span><button type="button" data-bg="${s.num}">배경으로 설정</button></div></div></article>`;
  }).join('');
  const none = !rated.length;
  return `${none ? '<div class="banner">아직 인벤 별점이 입력되지 않아 최신 스킨 순으로 보여주고 있어요. index.html 맨 위 <b>INVEN_SKIN_RATINGS</b>에 “스킨번호: 별점”을 적으면 별점 순위로 자동 정렬됩니다.</div>' : ''}
    <h2 class="sec" style="margin:.2rem 0 .8rem">요네 스킨 ${none ? '목록' : '순위'} <span style="color:var(--mute);font-weight:500;font-size:.85rem">· 총 ${all.length}종 (${esc(S.v)} 기준)</span></h2>
    <div class="skins">${cards}</div>`;
}

function render() {
  const v = $('#view');
  if (!S.loaded) return;
  v.innerHTML = S.tab === 'analysis' ? viewAnalysis() : S.tab === 'info' ? viewInfo() : viewSkins();
  $$('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.tab));
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (!b) return; S.tab = b.dataset.tab; render(); scrollTo({ top: 0 }); });
$('#view').addEventListener('click', e => {
  if (e.target.closest('#openPick')) return openModal();
  if (e.target.closest('#clearPick')) { S.enemy = null; return render(); }
  const r = e.target.closest('button[data-role]'); if (r) { S.role = r.dataset.role; return render(); }
  const bg = e.target.closest('button[data-bg]'); if (bg) { setBg(+bg.dataset.bg); const o = bg.textContent; bg.textContent = '적용됨 ✓'; setTimeout(() => bg.textContent = o, 1200); }
});

/* ==================== 챔피언 선택 모달 ==================== */
const CLS = [['all', '전체'], ['Fighter', '전사'], ['Assassin', '암살자'], ['Mage', '마법사'], ['Marksman', '원거리 딜러'], ['Tank', '탱커'], ['Support', '서포터']];
let mCls = 'all';
function openModal() {
  $('#modal').hidden = false;
  $('#mfilters').innerHTML = CLS.map(([k, n]) => `<button type="button" data-c="${k}" aria-pressed="${k === mCls}">${n}</button>`).join('');
  $('#msearch').value = ''; drawGrid(); setTimeout(() => $('#msearch').focus(), 30);
  document.body.style.overflow = 'hidden';
}
function closeModal() { $('#modal').hidden = true; document.body.style.overflow = ''; }
function drawGrid() {
  const q = $('#msearch').value.trim().toLowerCase();
  const list = S.list.filter(c => c.id !== 'Yone' || true).filter(c => (mCls === 'all' || c.tags.includes(mCls)) && (!q || c.name.toLowerCase().includes(q) || c.id.toLowerCase().includes(q)));
  $('#mgrid').innerHTML = list.length ? list.map(c => `<button type="button" data-id="${esc(c.id)}"><img src="${champImg(c)}" alt="" loading="lazy"><span>${esc(c.name)}</span></button>`).join('') : '<div class="empty">검색 결과가 없어요.</div>';
}
$('#msearch').addEventListener('input', drawGrid);
$('#mfilters').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; mCls = b.dataset.c; $$('#mfilters button').forEach(x => x.setAttribute('aria-pressed', x === b)); drawGrid(); });
$('#mgrid').addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (!b) return; S.enemy = S.champs[b.dataset.id]; closeModal(); S.tab = 'analysis'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
$('#mclose').onclick = closeModal;
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

/* ==================== 앱 진입 ==================== */
async function enterApp(u) {
  $('#auth').hidden = true; $('#app').hidden = false;
  $('#uname').textContent = u.name;
  const v = $('#view');
  v.innerHTML = '<div class="loading"><div class="spin"></div>최신 패치 데이터를 불러오는 중…</div>';
  try { await loadData(); render(); }
  catch (err) {
    console.error(err);
    v.innerHTML = '<div class="loading">데이터를 불러오지 못했어요.<br>인터넷 연결을 확인하고 다시 시도해 주세요.<br><br><button class="btn" id="retry" type="button">다시 시도</button></div>';
    $('#retry').onclick = () => enterApp(u);
  }
}

/* ==================== 꽃잎 배경 ==================== */
(function petals() {
  if (REDUCED) return;
  const c = $('#petals'), x = c.getContext('2d'); let W, H, P = [];
  const size = () => { const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0); };
  size(); addEventListener('resize', size);
  const mk = (init) => ({ x: Math.random() * (W + 200), y: init ? Math.random() * H : -20, s: 3 + Math.random() * 6, vx: -(.5 + Math.random() * 1.3), vy: .5 + Math.random() * .9, r: Math.random() * 6.28, vr: (Math.random() - .5) * .05, a: .25 + Math.random() * .4, c: Math.random() < .62 ? '79,227,214' : '255,61,110' });
  for (let i = 0; i < 46; i++) P.push(mk(true));
  (function loop() {
    if (!document.hidden) {
      x.clearRect(0, 0, W, H);
      for (const p of P) {
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        if (p.y > H + 20 || p.x < -30) Object.assign(p, mk(false), { x: Math.random() * (W + 200) });
        x.save(); x.translate(p.x, p.y); x.rotate(p.r);
        x.fillStyle = `rgba(${p.c},${p.a})`;
        x.beginPath(); x.ellipse(0, 0, p.s, p.s * .45, 0, 0, 6.283); x.fill(); x.restore();
      }
    }
    requestAnimationFrame(loop);
  })();
})();

/* ==================== 시작: 인트로 → 로그인 / 자동 로그인 ==================== */
(function init() {
  const sess = getSession();
  const intro = $('#intro');
  const finish = () => { if (!intro.isConnected) return; intro.remove(); };
  if (sess) { intro.remove(); enterApp(sess); return; }
  $('#auth').hidden = false;
  const t = setTimeout(finish, REDUCED ? 400 : 2600);
  const skip = () => { clearTimeout(t); intro.style.transition = 'opacity .25s'; intro.style.opacity = 0; setTimeout(finish, 250); };
  $('#skip').onclick = e => { e.stopPropagation(); skip(); };
  intro.addEventListener('click', skip);
})();
</script>
